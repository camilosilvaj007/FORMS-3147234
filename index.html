<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>FROMULARIO SENA V1</h1>
      <p class="subtitle">GRACIAS POR DEJAR SUS DATOS</p>
      <form>
        <label for="name">Nombre</label>
        <input
          type="text"
          id="name"
          placeholder="Por favor, introduzca su nombre"
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Por favor, introduzca su Email"
        />

        <label for="age">Edad</label>
        <input
          type="number"
          id="age"
          placeholder="Por favor, introduzca su Edad"
        />

        <label for="option">Elige una opción</label>
        <select id="option">
          <option>Seleccione una opcion</option>
          <option>Opcion 1</option>
          <option>Opcion 2</option>
          <option>Opcion 3</option>
        </select>

        <p>¿Planeas comprar un coche nuevo en los próximos 5 años?</p>
        <div class="radio-group">
          <label><input type="radio" name="buy_car" /> Si</label>
          <label><input type="radio" name="buy_car" /> No</label>
          <label><input type="radio" name="buy_car" /> Quizás</label>
        </div>

        <label for="car-brand">¿Cuál es tu marca de coche favorita?</label>
        <select id="car-brand">
          <option>Seleccione una Opcion</option>
          <option>Toyota</option>
          <option>BMW</option>
          <option>Chevrolet</option>
          <option>Otro</option>
        </select>

        <p>¿Qué tipo de medio de transporte posees?</p>
        <div class="checkbox-group">
          <label><input type="checkbox" /> Carro</label>
          <label><input type="checkbox" /> Barco</label>
          <label><input type="checkbox" /> Bicicleta</label>
          <label><input type="checkbox" /> Motocicleta</label>
          <label><input type="checkbox" /> Avión</label>
          <label><input type="checkbox" /> Bicicleta</label>
        </div>

        <label for="comments">¿Algún comentario/sugerencia?</label>
        <textarea
          id="comments"
          placeholder="Por favor, ingresa tus comentarios"
        ></textarea>

        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
